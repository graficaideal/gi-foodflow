<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/app_gestaocantinas_amarelo.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { min-height: 100%; }
      body {
        font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #151920;
        color: #e2e8f0;
      }
      button { cursor: pointer; font-family: inherit; }
      input, select, textarea { font-family: inherit; outline: none; color: #e2e8f0; }
      input:focus, select:focus {
        border-color: #e0cb4b !important;
        box-shadow: 0 0 0 2px rgba(224,203,75,0.15);
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 3px; }
      ::placeholder { color: #4a5568; }
      option { background: #1e242d; color: #e2e8f0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
